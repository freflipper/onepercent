name: Deploy web app to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Blank uses repository or Pages settings; auto ignores overrides; / forces the root; /repository sets a project path'
        required: false
        default: ''
        type: string

# Build scripts never receive deployment permissions.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout the deployment revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Set up pnpm from the committed project version
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate public configuration and select the Pages path
        run: node scripts/pages-ci.mjs configure
        env:
          PAGES_DETECTED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_PATH_OVERRIDE: ${{ inputs.base_path || vars.PAGES_BASE_PATH || 'auto' }}
      - name: Install the exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build the static web app
        run: pnpm build:web
      - name: Validate the complete Pages artifact
        run: node scripts/pages-ci.mjs verify
      - name: Upload Pages artifact including Expo pnpm font paths
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
